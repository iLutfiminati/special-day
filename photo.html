<style>
body {
  margin: 0;
  padding: 20px;
  font-family: 'Pacifico', cursive;
  background-color: #fff8f0;
  display: flex;
  flex-direction: column;
  align-items: center;
}

h1 {
  font-size: 2rem;
  margin-bottom: 20px;
  color: #ff69b4;
  text-align: center;
}

.back-btn {
  padding: 10px 25px;
  background: linear-gradient(90deg, #ff9ec3, #ff6b81);
  border: none;
  border-radius: 25px;
  font-size: 1rem;
  color: white;
  cursor: pointer;
  margin-bottom: 20px;
  transition: transform 0.2s, box-shadow 0.2s;
}
.back-btn:hover {
  transform: scale(1.1);
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

/* Album Grid */
.album {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 20px;
  max-width: 1000px;
  justify-items: center;
}

.polaroid {
  width: 180px;
  background: #fff;
  padding: 10px 10px 25px 10px;
  box-shadow: 0 8px 12px rgba(0,0,0,0.2);
  transform: rotate(calc(-5deg + 10deg * var(--i))) translateY(20px);
  opacity: 0;
  transition: transform 0.3s, opacity 0.3s;
  cursor: pointer;
  position: relative;
}
.polaroid.show {
  transform: rotate(calc(-5deg + 10deg * var(--i))) translateY(0);
  opacity: 1;
}
.polaroid:hover {
  transform: rotate(0deg) scale(1.05);
}
.polaroid img,
.polaroid video {
  width: 100%;
  display: block;
  border-radius: 5px;
  object-fit: cover;
  height: 180px;
}
.caption {
  margin-top: 10px;
  text-align: center;
  font-size: 0.9rem;
  color: #555;
}
.sticker {
  position: absolute;
  font-size: 24px;
  top: -10px;
  right: -10px;
  transform: rotate(calc(-20deg + 40deg * var(--i)));
}

/* Lightbox */
.lightbox {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.6);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 1000;
}
.lightbox.active {
  opacity: 1;
  pointer-events: auto;
}
.lightbox img,
.lightbox video {
  max-width: 90%;
  max-height: 80%;
  border-radius: 10px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.5);
}
.close-btn {
  position: absolute;
  top: 20px;
  right: 30px;
  font-size: 2rem;
  color: white;
  cursor: pointer;
  background: none;
  border: none;
}

/* Music Button */
.music-btn {
  position: fixed;
  bottom: 25px;
  right: 25px;
  background: linear-gradient(90deg, #ff8fab, #ff6b81);
  color: white;
  border: none;
  border-radius: 25px;
  padding: 10px 20px;
  cursor: pointer;
  font-family: 'Pacifico', cursive;
  font-size: 16px;
  box-shadow: 0 3px 10px rgba(255, 182, 193, 0.4);
  transition: transform 0.3s ease;
  z-index: 1100;
}
.music-btn:hover {
  transform: scale(1.1);
}

/* Responsive */
@media (max-width: 800px) {
  .album {
    grid-template-columns: repeat(3, 1fr);
  }
}
@media (max-width: 500px) {
  .album {
    grid-template-columns: repeat(2, 1fr);
  }
  .polaroid {
    width: 140px;
  }
}
</style>

  <video id="lightbox-video" controls style="display:none"></video>

<!-- Music -->
<audio id="bgMusic" loop>
  <source src="melodi.mp3" type="audio/mpeg">
</audio>
<button id="playBtn" class="music-btn">🎵 Play</button>

<script>
function goBack(){
  window.location.href = "celebrate.html";
}

// Fade-in polaroid
const polaroids = document.querySelectorAll('.polaroid');
polaroids.forEach((p, i) => {
  setTimeout(() => p.classList.add('show'), i*200);
});

// Lightbox
const lightbox = document.getElementById('lightbox');
const lbImg = document.getElementById('lightbox-img');
const lbVideo = document.getElementById('lightbox-video');

polaroids.forEach(p => {
  p.addEventListener('click', () => {
    const img = p.querySelector('img');
    const video = p.querySelector('video');

    if(img){
      lbVideo.style.display = 'none';
      lbVideo.pause();
      lbImg.src = img.src;
      lbImg.style.display = 'block';
    } else if(video){
      lbImg.style.display = 'none';
      lbVideo.src = video.src;
      lbVideo.style.display = 'block';
      lbVideo.play();
    }

    lightbox.classList.add('active');
  });
});

function closeLightbox(){
  lightbox.classList.remove('active');
  lbVideo.pause();
}

// Musik toggle
const music = document.getElementById('bgMusic');
const btn = document.getElementById('playBtn');

btn.addEventListener('click', () => {
  if(music.paused){
    music.play();
    btn.textContent = '⏸ Pause';
  } else {
    music.pause();
    btn.textContent = '🎵 Play';
  }
});
</script>
