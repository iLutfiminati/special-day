<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Celebrate 🌸</title>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">

<style>
  body {
    margin: 0;
    padding: 0;
    font-family: 'Pacifico', cursive;
    background: linear-gradient(135deg, #fceaff 0%, #ffe1f0 50%, #fff0f5 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    text-align: center;
    overflow: hidden;
    position: relative;
  }

  h1 {
    font-size: 2rem;
    margin-bottom: 40px;
    color: #ff6b81;
    animation: fadeIn 1.5s ease;
    z-index: 2;
  }

  .choices {
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 40px;
    z-index: 2;
  }

  .choice {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.3s ease, box-shadow 0.3s ease;
    background: rgba(255, 255, 255, 0.7);
    border-radius: 20px;
    padding: 15px;
    backdrop-filter: blur(6px);
  }

  .choice svg {
    width: 90px;
    height: 90px;
    margin-bottom: 10px;
  }

  .choice span {
    font-size: 1.2rem;
    color: #444;
  }

  .choice:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(255, 105, 180, 0.3);
  }

  .message {
    font-size: 1.4rem;
    color: #ff6b81;
    animation: fadeIn 2s ease 0.5s forwards;
    margin-bottom: 40px;
    opacity: 0;
    z-index: 2;
  }

  footer {
    position: absolute;
    bottom: 15px;
    font-size: 0.9rem;
    color: #666;
    z-index: 2;
  }

  footer a {
    color: #ff6b81;
    text-decoration: none;
  }

  footer a:hover {
    text-decoration: underline;
  }

  /* animasi bubble lebih jelas */
  .bubble {
    position: absolute;
    border-radius: 50%;
    opacity: 0.35;
    animation: float 12s infinite ease-in-out;
    filter: blur(1.2px);
  }

  .bubble:nth-child(1) { width: 90px; height: 90px; left: 10%; background: #ffd1dc; animation-delay: 1s; }
  .bubble:nth-child(2) { width: 70px; height: 70px; left: 80%; background: #bde0fe; animation-delay: 3s; }
  .bubble:nth-child(3) { width: 110px; height: 110px; left: 50%; background: #ffc8dd; animation-delay: 5s; }
  .bubble:nth-child(4) { width: 60px; height: 60px; left: 30%; background: #dbe2ef; animation-delay: 2s; }
  .bubble:nth-child(5) { width: 120px; height: 120px; left: 70%; background: #ffe1f0; animation-delay: 4s; }

  @keyframes float {
    0% { transform: translateY(0); opacity: 0.3; }
    50% { transform: translateY(-60px); opacity: 0.45; }
    100% { transform: translateY(0); opacity: 0.3; }
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (max-width: 500px) {
    h1 { font-size: 1.6rem; }
    .choice svg { width: 70px; height: 70px; }
    .message { font-size: 1.1rem; }
  }
</style>
</head>

<body>
  <!-- Doodle Bubbles -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <h1>Click to see what's inside 💝</h1>

  <div class="choices">
    <div class="choice" onclick="openPhoto()">
      <svg viewBox="0 0 64 64">
        <rect x="4" y="12" width="56" height="40" rx="6" ry="6" fill="#ffd6d6"/>
        <circle cx="32" cy="32" r="8" fill="#ff8c94"/>
        <rect x="20" y="20" width="8" height="8" fill="#fff"/>
      </svg>
      <span>Photo</span>
    </div>

    <div class="choice" onclick="openLetter()">
      <svg viewBox="0 0 64 64">
        <rect x="8" y="16" width="48" height="32" rx="4" ry="4" fill="#ffeb99"/>
        <polyline points="8,16 32,36 56,16" fill="none" stroke="#ff6b81" stroke-width="3"/>
      </svg>
      <span>Letter</span>
    </div>
  </div>

  <div class="message">I hope you like it 😄💖</div>

  <footer>
    &copy; 10 NOVEMBER 2025 — <a href="#">ltfrjalalfrd</a> 💫
  </footer>

<script>
function openPhoto() {
  window.location.href = "photo.html";
}
function openLetter() {
  window.location.href = "twilight-letter.html";
}
</script>

</body>
</html>
