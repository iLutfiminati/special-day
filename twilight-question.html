<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>On becoming a year older</title>
<style>
body {
  margin: 0;
  padding: 0;
  height: 100vh;
  font-family: 'Pacifico', cursive;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
  background: linear-gradient(180deg, #f8e1f4 0%, #c6e2ff 100%);
}

img {
  width: 180px;
  height: auto;
  margin-bottom: 25px;
  filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
}

/* Efek teks */
h1 {
  font-size: 24px;
  color: #4a4a6a;
  margin-bottom: 50px;
  line-height: 1.6;
  text-shadow: 0 1px 2px rgba(255,255,255,0.6);
}

/* Tombol */
.buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  flex-wrap: wrap;
  position: relative;
  width: 100%;
  max-width: 400px;
  height: 80px;
}

button {
  padding: 14px 35px;
  border: none;
  border-radius: 30px;
  font-size: 18px;
  color: white;
  cursor: pointer;
  position: absolute;
  opacity: 0;
  transition: left 0.1s linear, top 0.1s linear, opacity 0.3s ease, transform 0.2s;
}

button:hover {
  transform: scale(1.05);
}

#noBtn {
  background-color: #a5d8ff;
  box-shadow: 0 4px 8px rgba(165, 216, 255, 0.6);
  position: relative;
}

#yesBtn {
  background-color: #f8a5c2;
  box-shadow: 0 4px 8px rgba(248, 165, 194, 0.6);
  pointer-events: none;
  left: 0;
  top: 0;
}
</style>
</head>
<body>

<img src="https://media.tenor.com/hoblaIrKqRgAAAAj/bubu-dudu.gif" alt="Bubu Dudu Tengil">
<h1 id="question"></h1>

<div class="buttons">
  <button id="noBtn">Enggak kok 😇</button>
  <button id="yesBtn">Tengil banget 😤</button>
</div>

<script>
const questionText = "Aku ada pertanyaan buatmu nih......\nMenurutmu, aku tengil gak sih?\nSoalnya menurutku sih enggak… tapi entah kenapa orang-orang suka bilang iya 🥲";
const questionElement = document.getElementById("question");
const noBtn = document.getElementById('noBtn');
const yesBtn = document.getElementById('yesBtn');
let index = 0;

function typeWriter() {
  if (index < questionText.length) {
    const char = questionText.charAt(index);
    questionElement.innerHTML += (char === "\n" ? "<br>" : char);
    index++;
    setTimeout(typeWriter, 110);
  } else {
    noBtn.style.opacity = "1";
    yesBtn.style.opacity = "1";
  }
}

window.onload = typeWriter;

noBtn.addEventListener('click', () => {
  window.location.href = "twilight-thanks.html";
});

let currentLeft = yesBtn.offsetLeft;
let currentTop = yesBtn.offsetTop;
let targetLeft = currentLeft;
let targetTop = currentTop;

document.addEventListener('mousemove', (e) => {
  const rect = yesBtn.getBoundingClientRect();
  const mouseX = e.clientX;
  const mouseY = e.clientY;
  const btnX = rect.left + rect.width / 2;
  const btnY = rect.top + rect.height / 2;
  const safeDistance = 120;

  const dx = mouseX - btnX;
  const dy = mouseY - btnY;
  const distance = Math.sqrt(dx*dx + dy*dy);

  if(distance < safeDistance){
    const moveFactor = 0.6;
    targetLeft = currentLeft + (dx / distance) * -safeDistance * moveFactor;
    targetTop = currentTop + (dy / distance) * -safeDistance * moveFactor;

    targetLeft = Math.min(Math.max(targetLeft, 0), window.innerWidth - yesBtn.offsetWidth);
    targetTop = Math.min(Math.max(targetTop, 0), window.innerHeight - yesBtn.offsetHeight);
  }
});

function animate(){
  currentLeft += (targetLeft - currentLeft) * 0.15;
  currentTop += (targetTop - currentTop) * 0.15;
  yesBtn.style.left = currentLeft + "px";
  yesBtn.style.top = currentTop + "px";
  requestAnimationFrame(animate);
}
animate();
</script>

</body>
</html>
