<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Screen</title>
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      text-align: center;
      margin: 0;
      padding: 0;
      color: #333;
      background: linear-gradient(135deg, #ffe6f0, #dbeaff);
      background-image: url('https://www.transparenttextures.com/patterns/sketchy.png');
      background-size: 400px;
      overflow: hidden;
    }

    /* Tampilan loading */
    #countdown-container {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-size: 2em;
      color: #ff5f9e;
      text-shadow: 0 0 8px rgba(255, 105, 180, 0.5);
      animation: fadeIn 1.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* Kalender */
    #calendar-container {
      display: none;
      min-height: 100vh;
      padding: 30px 15px;
      background: linear-gradient(135deg, #fef6ff, #f0f8ff);
      background-image: url('https://www.transparenttextures.com/patterns/graphy.png');
      background-size: 400px;
      animation: fadeInUp 1.5s ease-in-out;
    }

    h1 {
      font-family: 'Pacifico', cursive;
      color: #ff6fa0;
      text-shadow: 0 0 10px rgba(255, 182, 193, 0.6);
      animation: fadeInUp 2s ease-in-out;
    }

    h2 {
      color: #888;
      font-weight: 400;
      letter-spacing: 2px;
      margin-top: -10px;
      animation: fadeInUp 2.3s ease-in-out;
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .calendar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(60px, 1fr));
      gap: 10px;
      max-width: 600px;
      margin: 30px auto;
    }

    .day {
      padding: 20px;
      background-color: rgba(255, 255, 255, 0.7);
      border: 1px solid #ffcce0;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      font-size: 1.2em;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .day:hover {
      background-color: #ffe0eb;
      transform: scale(1.07);
      box-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
    }

    .birthday {
      background-color: #ff69b4;
      color: white;
      font-weight: bold;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 105, 180, 0.5); }
      50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(255, 105, 180, 0.7); }
    }

    /* Responsif */
    @media (max-width: 500px) {
      .day {
        padding: 15px;
        font-size: 1em;
      }
    }
  </style>
</head>
<body>
  <!-- Loading -->
  <div id="countdown-container">
    <div>✨ Memuat kalender spesial ✨</div>
    <div>Dalam <span id="countdown">5</span> detik...</div>
  </div>

  <!-- Kalender -->
  <div id="calendar-container">
    <h1>November</h1>
    <h2>10 NOVEMBER 2025 💖</h2>
    <div class="calendar">
      <div class="day">1</div>
      <div class="day">2</div>
      <div class="day">3</div>
      <div class="day">4</div>
      <div class="day">5</div>
      <div class="day">6</div>
      <div class="day">7</div>
      <div class="day">8</div>
      <div class="day">9</div>
      <div class="day birthday" onclick="goToPage()">10</div>
      <div class="day">11</div>
      <div class="day">12</div>
      <div class="day">13</div>
      <div class="day">14</div>
      <div class="day">15</div>
      <div class="day">16</div>
      <div class="day">17</div>
      <div class="day">18</div>
      <div class="day">19</div>
      <div class="day">20</div>
      <div class="day">21</div>
      <div class="day">22</div>
      <div class="day">23</div>
      <div class="day">24</div>
      <div class="day">25</div>
      <div class="day">26</div>
      <div class="day">27</div>
      <div class="day">28</div>
      <div class="day">29</div>
      <div class="day">30</div>
    </div>
  </div>

  <script>
    let countdown = 5;
    const countdownEl = document.getElementById("countdown");
    const countdownContainer = document.getElementById("countdown-container");
    const calendarContainer = document.getElementById("calendar-container");

    const timer = setInterval(() => {
      countdown--;
      countdownEl.textContent = countdown;

      if (countdown <= 0) {
        clearInterval(timer);
        countdownContainer.style.display = "none";
        calendarContainer.style.display = "block";
        document.body.style.overflow = "auto";
      }
    }, 1000);

    function goToPage() {
      window.location.href = "twilight-question.html";
    }
  </script>
</body>
</html>
