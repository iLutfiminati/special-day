<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>One More 🌠</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Pacifico', cursive;
      text-align: center;
      overflow: hidden;
      height: 100vh;
      background: linear-gradient(180deg, #f8e1f4 0%, #c6e2ff 100%);
      position: relative;
    }

    /* Bintang lembut di background */
    .stars {
      position: absolute;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      z-index: 0;
    }

    .star {
      position: absolute;
      width: 3px;
      height: 3px;
      background: white;
      border-radius: 50%;
      animation: twinkle 3s infinite ease-in-out;
      opacity: 0.8;
    }

    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.4); }
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      animation: fadeIn 2s ease-in;
    }

    img {
      width: 160px;
      height: auto;
      margin-bottom: 20px;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      filter: drop-shadow(0 3px 8px rgba(0,0,0,0.1));
    }

    h1 {
      font-size: clamp(20px, 6vw, 28px);
      color: #4a4a6a;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 2s ease 1.5s forwards;
      text-shadow: 0 1px 2px rgba(255,255,255,0.6);
    }

    button {
      padding: 15px 25px;
      border: none;
      border-radius: 50%;
      font-size: 26px;
      cursor: pointer;
      background: linear-gradient(90deg, #a5d8ff, #f8a5c2);
      color: white;
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 2s ease 2.5s forwards;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(248,165,194,0.5);
    }

    button:hover {
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255,182,193,0.7);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Responsif */
    @media (max-width: 480px) {
      img {
        width: 130px;
      }
      h1 {
        font-size: 22px;
      }
    }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="container">
    <img src="https://media.tenor.com/vr4kNW-3YrcAAAAj/bubu-dudu-sseeyall.gif" alt="Apipi Panda">
    <h1>Yayyy~ Terima kasih ya 😇✨</h1>
    <button onclick="goHome()"><i class="fas fa-arrow-right"></i></button>
  </div>

  <script>
    // Generate bintang random
    const starContainer = document.getElementById('stars');
    for (let i = 0; i < 30; i++) {
      const star = document.createElement('div');
      star.classList.add('star');
      star.style.top = Math.random() * 100 + '%';
      star.style.left = Math.random() * 100 + '%';
      star.style.animationDelay = Math.random() * 3 + 's';
      starContainer.appendChild(star);
    }

    function goHome() {
      window.location.href = "index.html";
    }
  </script>
</body>
</html>
